name: Pubblica su GitHub Pages

on:
  push:
    branches:
      - main   # l'ambiente github-pages accetta deploy solo dal branch predefinito
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Richiede che Pages sia gia' attivo con Source = "GitHub Actions"
      # (Settings -> Pages). Il token del workflow non ha i permessi per
      # crearlo da solo: "Resource not accessible by integration".
      - uses: actions/configure-pages@v5
      - name: Carica il sito statico
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
